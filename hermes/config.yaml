mcp_servers:
  context7:
    url: https://mcp.context7.com/mcp
    enabled: true
  wolfram:
    url: https://agenttools.wolfram.com/mcp
    enabled: true
  yahoo_finance:
    command: uvx
    args:
      - --from
      - yahoo-finance-mcp-server
      - yahoo-finance-mcp-server
    enabled: true
  india_market:
    command: /tmp/india-market-mcp/.venv/bin/python
    args:
      - -m
      - src.server
    cwd: /tmp/india-market-mcp
    enabled: false
    timeout: 120
  github-local:
    command: /home/openclaw/.local/bin/github-mcp-server-hermes
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN}
    enabled: true
  finstack:
    command: /home/openclaw/.local/bin/finstack-mcp-hermes
    env:
      SEC_EDGAR_USER_AGENT: FinStack/0.10.0 hermes-local
      FYERS_APP_ID: ${FYERS_APP_ID}
      FYERS_CLIENT_ID: ${FYERS_CLIENT_ID}
      FYERS_ACCESS_TOKEN: ${FYERS_ACCESS_TOKEN}
    enabled: false
  fyers:
    url: https://mcp.fyers.in/mcp
    enabled: false
    auth: oauth
    connect_timeout: 30.0
    oauth:
      client_id: RDFWLQF7A6-100
      client_secret: ${REDACTED_SECRET}
  fyers-local:
    command: /home/openclaw/.local/bin/fyers-mcp-server-hermes
    connect_timeout: 30.0
    tools:
      include:
        - authenticate
        - complete_authentication
        - check_auth_status
        - get_profile
        - get_funds
        - get_holdings
        - get_positions
        - get_orders
        - get_quotes
    enabled: false
  angel_one:
    command: /bin/bash
    args:
      - -lc
      - set -a; . /home/openclaw/angel-one.env; set +a; exec /home/openclaw/angel-one-mcp-venv/bin/python
        -m angel_one_mcp.server
    timeout: 120
    connect_timeout: 60
  exchange_rss:
    command: /home/openclaw/angel-one-mcp-venv/bin/python
    args:
      - /home/openclaw/exchange-rss-mcp/server.py
    timeout: 60
    connect_timeout: 30
  market_intelligence:
    command: /home/openclaw/angel-one-mcp-venv/bin/python
    args:
      - /home/openclaw/market-intelligence-mcp/server.py
    timeout: 60
    connect_timeout: 30
    enabled: false
platforms:
  discord:
    enabled: true

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
